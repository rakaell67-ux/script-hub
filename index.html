<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script Hub — rakaxscript</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        :root {
            --gelap: #121212;
            --abu: #1F1F1F;
            --biru: #00A2FF;
            --hijau: #00B06F;
            --merah: #E74C3C;
            --kuning: #FFC107;
            --putih: #E5E7EB;
            --batas: #333333;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0F0F0F, #1A1A1A, #0F0F0F);
            background-size: 400% 400%;
            animation: latarGerak 15s ease-in-out infinite;
            color: var(--putih);
            padding: 25px 15px;
        }
        @keyframes latarGerak {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container { max-width: 560px; margin: 0 auto; }

        
.judul {
  text-align: center;
  font-size: 36px;
  font-weight: 600; /* ← gak terlalu tebal */
  margin-bottom: 30px;
  letter-spacing: 1.5px;
  color: #ffffff;

  /* Font halus = sama kayak tulisan rakaxscript di bawah */
  font-family: 'Segoe UI', 'SF Pro Display', 'Roboto', Arial, sans-serif;

  /* Bayangan lembut saja */
  text-shadow: 0 0 6px rgba(0, 162, 255, 0.5);
}

.judul span {
  color: #00ccff;
  text-shadow: 0 0 6px rgba(0, 204, 255, 0.6);
}



@keyframes lembut {
  0% { background-position: 0% 50%; }
  100% { background-position: 300% 50%; }
}


        .kotak {
            background: var(--abu);
            border: 2px solid var(--batas);
            border-radius: 8px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }
        .kotak:hover {
            transform: translateY(-2px);
            border-color: var(--biru);
        }

        .label-daftar {
            display: block;
            margin-bottom: 15px;
            font-weight: 700;
            color: #CCCCCC;
            font-size: 16px;
        }

        .script-item {
            background: var(--gelap);
            border: 2px solid var(--batas);
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 14px;
            transition: border-color 0.2s ease;
        }
        .script-item:hover { border-color: var(--biru); }

        .info-baris {
            font-weight: 800;
            font-size: 15px;
            margin-bottom: 6px;
        }
        .nama-script { color: var(--kuning); }
        .nama-map { color: var(--hijau); }

        .isi-kode {
            color: #D1D5DB;
            font-size: 14px;
            line-height: 1.6;
            margin: 12px 0;
            padding: 14px;
            background: #0A0A0A;
            border-radius: 6px;
            border-left: 4px solid var(--biru);
            font-family: 'Consolas', 'Monaco', monospace;
            word-break: break-all;
        }

        .tombol {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 0 rgba(0,0,0,0.35);
        }
        .tombol:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.35);
        }

        .tombol-hijau {
            background: var(--hijau);
            color: #fff;
        }
        .tombol-hijau:hover { background: #009E63; }

        .pesan-salin {
            margin-top: 10px;
            font-weight: 700;
            color: var(--hijau);
            height: 24px;
        }

        .footer {
  text-align: center;
  margin-top: 35px;
  font-size: 22px;
  font-weight: bold;
  background: linear-gradient(90deg, #ff4d4d, #ff9933, #ffff33, #33cc33, #3399ff, #9933ff);
  background-size: 400%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: pelangi 4s linear infinite;
  letter-spacing: 2px;
}

@keyframes pelangi {
  0% { background-position: 0%; }
  100% { background-position: 400%; }
}

    </style>
</head>
<body>

<div class="container">
    <h1 class="judul"><span>🎮</span> SCRIPT ROBLOX <span>🎮</span></h1>

    <div class="kotak">
        <span class="label-daftar">📂 Daftar Script</span>
        <div id="daftarScript"></div>
    </div>

    <p class="footer">rakaxscript</p>
</div>

<script>
// =====================================================
// 👇 EDIT / TAMBAH SCRIPT DI BAWAH INI 👇
// =====================================================
const DAFTAR_SCRIPT = [
    {
        namaScript: "Auto Farm",
        namaMap: "Blox Fruits",
        isi: "loadstring(game:HttpGet('https://contoh-link-script.com/farm'))()"
    },
    {
        namaScript: "ESP + Aim",
        namaMap: "Murder Mystery 2",
        isi: "loadstring(game:HttpGet('https://contoh-link-script.com/esp'))()"
    }
];
// =====================================================
// 👆 TAMBAH SCRIPT BARU DI ATAS, IKUTI FORMATNYA
// =====================================================

const wadah = document.getElementById('daftarScript');

if (DAFTAR_SCRIPT.length === 0) {
    wadah.innerHTML = '<p style="color:#6B7280;font-style:italic;text-align:center;padding:20px;">Belum ada script.</p>';
} else {
    DAFTAR_SCRIPT.forEach((item, indeks) => {
        const kartu = document.createElement('div');
        kartu.className = 'script-item';
        kartu.innerHTML = `
            <div class="info-baris nama-script">📜 Name Script = ${escapeHtml(item.namaScript)}</div>
            <div class="info-baris nama-map">🗺️ Name Map = ${escapeHtml(item.namaMap)}</div>
            <div class="isi-kode">${escapeHtml(item.isi)}</div>
            <button class="tombol tombol-hijau" onclick="salinKode(${indeks}, this)">📋 Salin Kode</button>
            <p class="pesan-salin" id="pesan-${indeks}"></p>
        `;
        wadah.appendChild(kartu);
    });
}

function salinKode(index, tombol) {
    navigator.clipboard.writeText(DAFTAR_SCRIPT[index].isi).then(() => {
        const pesan = document.getElementById(`pesan-${index}`);
        pesan.textContent = "✅ Berhasil disalin!";
        tombol.textContent = "✅ Disalin!";
        setTimeout(() => {
            pesan.textContent = "";
            tombol.textContent = "📋 Salin Kode";
        }, 2500);
    });
}

function escapeHtml(teks) {
    const div = document.createElement('div');
    div.textContent = teks;
    return div.innerHTML;
}
</script>

</body>
</html>
